name: Flask App CI/CD Pipeline

# Trigger the workflow on pushes to the 'main' branch
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # Job 1: Test the Flask App
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3  # Updated to the latest version

      - name: Set up Python 3.9
        uses: actions/setup-python@v4  # Updated to the latest version
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests

  # Job 2: Build and Push Docker Image to DockerHub
  build-and-push:
    runs-on: ubuntu-latest
    needs: test  # Run this job only after 'test' completes

    steps:
      - name: Checkout code
        uses: actions/checkout@v3  # Updated to the latest version

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/emotion-detection-mlops .

      - name: Log in to DockerHub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Push Docker image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/emotion-detection-mlops
